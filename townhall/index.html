<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="The Preparing You Townhall now opens right inside the app. Join muted, raise your hand, react and chat. Watch the 30-second preview.">
<!-- Link preview: the broadcast link is shared by email and in messages. -->
<meta property="og:type" content="video.other">
<meta property="og:site_name" content="Preparing You">
<meta property="og:title" content="The Townhall has a new home">
<meta property="og:description" content="It now opens right inside the Preparing You app. Watch the 30-second preview.">
<meta property="og:url" content="https://preparingyou.app/townhall/">
<meta property="og:image" content="https://preparingyou.app/townhall-og.jpg">
<meta property="og:image:secure_url" content="https://preparingyou.app/townhall-og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:video" content="https://preparingyou.app/townhall-new.mp4">
<meta property="og:video:type" content="video/mp4">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Townhall has a new home">
<meta name="twitter:description" content="It now opens right inside the Preparing You app. Watch the 30-second preview.">
<meta name="twitter:image" content="https://preparingyou.app/townhall-og.jpg">
<meta name="theme-color" content="#4f2170">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
<style>
  :root{--parch:#faf6e9;--purple:#4f2170;--purple-deep:#371751;--gold:#a0772a;--walnut:#3a2818;--walnut-mid:#6f5641;--line:#e8dec3}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--parch);color:var(--walnut);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--purple);font-weight:650;font-size:17px}
  .brand img{width:34px;height:34px;border-radius:8px}
  h1{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;font-size:clamp(26px,7vw,36px);line-height:1.15;color:var(--purple);margin:14px 0 6px}
  .sub{margin:0 0 14px;color:var(--walnut-mid);font-size:16px;line-height:1.5}
  .player{position:relative;width:min(100%,46vh,300px);margin:0 auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#1e162b;box-shadow:0 10px 30px rgba(55,23,81,.22)}
  .player video{width:100%;height:100%;display:block;object-fit:cover}
  .play{position:absolute;inset:0;margin:auto;width:86px;height:86px;border-radius:50%;border:none;background:rgba(79,33,112,.92);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .play svg{margin-left:6px}
  .play[hidden]{display:none}
  .cta{display:block;margin:18px auto 10px;max-width:340px;padding:15px 18px;border-radius:999px;background:var(--purple);color:#fff;text-decoration:none;font-weight:650;font-size:17px}
  .cta:active{background:var(--purple-deep)}
  .note{font-size:14px;color:var(--walnut-mid);line-height:1.5;margin:6px auto 0;max-width:340px}
  .note a{color:var(--purple)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/icon-192.png" alt="">Preparing You</a>
  <h1>The Townhall has a new home</h1>
  <p class="sub">It now opens right inside the app. Join muted, raise your hand, send a reaction and chat along.</p>

  <div class="player">
    <video id="v" src="/townhall-new.mp4" poster="/townhall-new-poster.jpg" playsinline preload="metadata"></video>
    <button class="play" id="play" aria-label="Play the 30-second preview">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20"/></svg>
    </button>
  </div>

  <a class="cta" href="/app/">Open Preparing You</a>
  <p class="note">Your next Townhall is on your home screen, in your local time. Tap the Townhall card to join.</p>
  <p class="note">New here? <a href="/">Start with Preparing You</a></p>
</main>
<script>
  // Phones won't autoplay with sound, so it's one tap: the big button starts
  // it, then the native controls take over.
  (function(){
    var v = document.getElementById('v'), b = document.getElementById('play');
    b.addEventListener('click', function(){ v.controls = true; b.hidden = true; v.play().catch(function(){}); });
    v.addEventListener('ended', function(){ v.controls = false; b.hidden = false; });
  })();
</script>
</body>
</html>

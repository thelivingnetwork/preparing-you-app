services:
  - type: web
    name: preparing-you-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    envVars:
      - key: ALLOWED_ORIGIN
        value: "https://preparingyou.netlify.app"
      - key: SUPABASE_URL
        sync: false   # set in Render dashboard once the new Supabase project exists
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TLN_HANDOFF_SECRET
        sync: false   # used to sign the JWT that hands the user off to TLN
      - key: OPENAI_API_KEY
        sync: false   # used for embeddings (text-embedding-3-small, 1536-dim) for Paul's RAG
      - key: RESEND_API_KEY
        sync: false   # transactional email (PCM election notifications)
      - key: RESEND_FROM
        value: "Preparing You <onboarding@resend.dev>"
      - key: DAILY_API_KEY
        sync: false   # Daily.co — host-moderated video rooms (PCM calls + townhall)
      - key: EMAILJS_PRIVATE_KEY
        sync: false   # EmailJS server-side access token — used by townhall reminder cron
      - key: VAPID_PUBLIC_KEY
        sync: false   # web-push VAPID public key — also hardcoded in client index.html
      - key: VAPID_PRIVATE_KEY
        sync: false   # web-push VAPID private key — server-only
      - key: VAPID_SUBJECT
        value: "mailto:tofnotifications@gmail.com"
